{% extends 'base.html' %}

{% block title %}注文確認{% endblock title %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4 bgc-text">注文確認</h2>

    <div class="cart-body card mb-4 product-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0 cart-table">
                <thead class="cart-table-head">
                    <tr>
                        <th scope="col">商品</th>
                        <th scope="col" class="text-center">数量</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in cart_items %}
                    <tr class="conf">
                        <td>{{ item.product.name }}</td>
                        <td class="text-center">{{ item.quantity }}個</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>

    <form method="post" onsubmit="return confirmOrder()" class="card">
        {% csrf_token %}

        <div class="card-body product-card">
            <h4 class="mb-4">選択必須項目</h4>
            <div class="mb-4">
                <label for="nickname" class="fs-5">ニックネーム</label>
                <label for="nickname" class="fs-6">*10文字以内で入力してください</label>
                <input type="text" name="nickname" id="nickname"
                    class="form-control" maxlength="10" required>
            </div>
            <fieldset>
                <legend class="fs-7">担当スタッフ</legend>
                <legend class="fs-6">*一人お選びください</legend>
                <div id="staff-choices">
                    {% include "product/staff_choices.html" %}
                </div>
            </fieldset>
        </div>

        <div class="card-footer text-end">
            <button type="submit" class="btn btn-dark mt-autoy">
                注文を確定する
            </button>
        </div>
    </form>
</div>
{% endblock content %}
